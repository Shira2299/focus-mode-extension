name: Build and release extension

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: node build.js

      - name: Zip builds
        run: |
          (cd dist/chrome && zip -r ../../focus-mode-chrome.zip .)
          (cd dist/firefox && zip -r ../../focus-mode-firefox.zip .)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "מצב ריכוז — build ${{ github.run_number }}"
          body: |
            בנייה אוטומטית מ-main.
            הורידו את קובץ ה-ZIP המתאים לדפדפן שלכם וטענו אותו כ"תוסף לא ארוז" — הוראות מלאות בדף ההתקנה.
          files: |
            focus-mode-chrome.zip
            focus-mode-firefox.zip
